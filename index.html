<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.scss">
  <title>Frontend Mentor | Todo app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main class="app">
    <div class="app__warper">
      <header class="header">
        <h1 class="header__title">TODO</h1>
        <button class="header__theme-toggle" tabindex="0">
          <img class="header__themeImage" src="images/icon-moon.svg" alt="moon icon" >
        </button>
      </header>
      <div class="taskBarInput">
        <div class="taskBarInput__checkBatton">
          <img class="checkBatton__image" src="images/icon-check.svg" alt="check icon" >
        </div>
        <form action="" class="taskBarForm">
          <input class="taskInputBar__input" type="text" placeholder="Create a new todo..." />
          <input class="taskInputBar__inputSubmit" type="submit" />
        </form>
      </div>
      <div class="tasksContainer">
        <ul class="tasksContainer__list">
          <!-- Tasks will be dynamically added here -->
          <li class="taskItem">
            <div class="taskItem__leftSide">
              <div class="checkBatton">
                <img class="checkBatton__image" src="images/icon-check.svg" alt="check icon" >
              </div>
              <span class="taskItem__text">Buy groceries</span>
            </div>
            <div class="taskItem__rightSide">
              <button class="taskItem__deleteButton" tabindex="0">
                <img class="taskItem__deleteButtonImage" src="images/icon-cross.svg" alt="cross icon" >
              </button>
            </div>
          </li>
        </ul>
      
        <div class="tasksContainer__footer">
          <span class="tasksContainer__itemsLeft">0 items left</span>
          <div class="taskContainer__filter">
            <button class="taskContainer__filterButton active" tabindex="0" data-filter="all">All</button>
            <button class="taskContainer__filterButton" tabindex="0" data-filter="active">Active</button>
            <button class="taskContainer__filterButton" tabindex="0" data-filter="completed">Completed</button>
          </div>
          <button class="tasksContainer__clearCompleted">Clear Completed</button>
        </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Marwan AlBadri</a>.
  </footer>
  <script type="module" src="index.js"></script>
</body>
</html>
